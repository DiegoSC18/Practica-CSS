<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica Materialize - Catálogo de deportes</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>
  <div class="container">
    <h1>Catálogo de deportes</h1>
    <div class="row">

      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image" style="height:120px;background-color:#ffcc80;"></div>
          <div class="card-content">
            <span class="card-title">Camiseta del Real Madrid</span>
            <p>Precio: S/ 189.00</p>
          </div>
          <div class="card-action">
            <a href="#">Ver detalle</a>
          </div>
        </div>
      </div>

      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image" style="height:120px;background-color:#a5d6a7;"></div>
          <div class="card-content">
            <span class="card-title">Pelota del Mundial</span>
            <p>Precio: S/ 129.00</p>
          </div>
          <div class="card-action">
            <a href="#">Ver detalle</a>
          </div>
        </div>
      </div>

      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image" style="height:120px;background-color:#90caf9;"></div>
          <div class="card-content">
            <span class="card-title">Casaca Adidas de entrenamiento</span>
            <p>Precio: S/ 159.00</p>
          </div>
          <div class="card-action">
            <a href="#">Ver detalle</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
