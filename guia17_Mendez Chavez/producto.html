<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo de tarjeta Materialize</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col s12 m6 l4">
        <div class="card">
          <div class="card-image" style="height:120px;background-color:#eeeeee;"></div>
          <div class="card-content">
            <span class="card-title">Cuaderno A5</span>
            <p>Precio: S/ 12.00</p>
          </div>
          <div class="card-action">
            <a href="#">Ver detalle</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
